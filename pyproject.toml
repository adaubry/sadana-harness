[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sadana"
version = "0.0.1"
description = "sadana-harness"
requires-python = ">=3.11"
dependencies = ["jsonschema"]

[tool.setuptools.packages.find]
where = ["src"]

# ── ruff ─────────────────────────────────────────────────────────────────────
# Arguments live here, not in the Makefile and not in .pre-commit-config.yaml.
# One owner. Adjust line-length to taste before you have code to reformat.
[tool.ruff]
# 120 rather than 88: scripts/artifact.py already has lines in the low 100s,
# and a lint that is red on day one for reasons unrelated to your change is a
# lint people learn to ignore. Tighten it later, in its own work item.
line-length = 120
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# ── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
files = ["src"]
# ponytail: model_providers/*/provider.py are dynamically loaded via
# importlib.util.spec_from_file_location (mirroring hermes's own provider
# discovery), never `import`ed as regular packages — several directory names
# carry hyphens, so mypy's package-derived module naming collides them all
# onto one "provider" module. Excluded rather than fought; the logic worth
# type-checking (Request/Outcome, classify(), send()) lives in
# sadana/model_access.py and stays covered. Upgrade path: if a second wired
# provider grows enough real logic to want static checking, give it a
# hyphen-free package under sadana/ proper and re-include it here.
exclude = ["^src/sadana/model_providers/"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

# jsonschema ships no py.typed marker (no inline types, no maintained stub
# package worth adding for the one function this project calls).
[[tool.mypy.overrides]]
module = "jsonschema.*"
ignore_missing_imports = true

# ── pytest ───────────────────────────────────────────────────────────────────
# Tiers are markers so `-m unit` works, and --strict-markers means a typo in a
# marker is an error rather than a silently-unfiltered run.
[tool.pytest.ini_options]
testpaths = ["tests"]
# src-layout: without this, `import sadana` fails under the hermetic runner
# unless the package is pip-installed. pythonpath keeps the venv disposable —
# no editable install to go stale, nothing to re-run when metadata changes.
pythonpath = ["src"]
addopts = "--strict-markers -q"
markers = [
  "unit: touches only the module under test",
  "integration: crosses a real boundary",
  "contract: pins an external interface",
  "eval: model-in-the-loop, slow, not part of the default gate",
]
